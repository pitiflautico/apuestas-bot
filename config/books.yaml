# Market Mappings
market_mappings:
  basketball:
    points:
      the_odds_api: "player_points"
      betfair: "PLAYER_POINTS"

    rebounds:
      the_odds_api: "player_rebounds"
      betfair: "PLAYER_REBOUNDS"

    assists:
